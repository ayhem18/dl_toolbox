[project]
name = "dl-toolbox"
version = "0.1.0"
description = "Battle-tested deep learning utilities shared across projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dl = [
    "numpy>=1.26.0",
    "torch>=2.4.0",
    "lightning>=2.0.0",
]
geometry = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]
tensorboard = [
    "numpy>=1.26.0",
    "pandas>=2.0",
    "torch>=2.4.0",
    "tensorboard",
]
wandb = [
    "wandb",
]
mlflow = [
    "mlflow",
    "numpy>=1.26.0",
]

[project.scripts]
dl-toolbox = "dl_toolbox.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

# CUDA wheels: Windows cu118, Linux cu124 (same as seam_embedder / powder_segmenter).
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
