[project]
name = "dl-toolbox"
version = "0.1.0"
description = "Battle-tested deep learning utilities shared across projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.66.0",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dl = [
    "numpy>=1.26.0",
    "torch>=2.4.0",
    "lightning>=2.0.0",
]
geometry = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]
tensorboard = [
    "numpy>=1.26.0",
    "pandas>=2.0",
    "torch>=2.4.0",
    "tensorboard",
]
wandb = [
    "wandb",
]
mlflow = [
    "mlflow",
    "numpy>=1.26.0",
]

[project.scripts]
dl-toolbox = "dl_toolbox.project_layout.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

# CUDA wheels: Windows cu118, Linux cu124 (same as seam_embedder / powder_segmenter).
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
# Only packages that already have a contract. Other tests stay on disk until rewrite.
testpaths = [
    "tests/base/input_output/test_image.py",
    "tests/base/input_output/test_image_spec.py",
    "tests/base/input_output/test_json_io.py",
    "tests/base/packaging",
    "tests/base/file_management/test_file.py",
    "tests/base/file_management/test_directory.py",
    "tests/dl_engine/loggers/test_logger.py",
    "tests/dl_engine/loggers/test_tensorboard.py",
    "tests/dl_engine/loggers/test_mlflow.py",
    "tests/dl_engine/dl_engine_utils/image_patchify",
    "tests/dl_engine/runs",
    "tests/base/hashing/test_hash_manager.py",
    "tests/data_contract",
    "tests/project_layout",
    "tests/dl_engine/exp_engine",
]
